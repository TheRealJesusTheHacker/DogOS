# DogOS kernel hardening sysctls (spec section 7).
# NOTE: some pentest tools (sniffers, raw-socket scanners) may need relaxed
# settings — document exceptions in dogos-engage rather than weakening defaults.
# MPTCP: no DogOS workflow uses multipath TCP; an enabled-but-unused
# protocol feature is pure attack surface (CVE-2026-98432 class).
# Fleet lockdown 2026-10-31.
net.mptcp.enabled = 0
net.ipv4.ip_forward = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.unprivileged_bpf_disabled = 2
net.core.bpf_jit_harden = 2
# 1 (not 2): the distro ships its own debuggers (gdb etc.) — 2 blocks
# unprivileged ptrace of even the user's own processes.
kernel.yama.ptrace_scope = 1
