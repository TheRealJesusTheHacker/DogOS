#!/usr/sbin/nft -f
# DogOS base firewall — default-deny incoming (spec section 7).
# Engagement listeners are opened explicitly via `dogos-engage`.
flush ruleset

table inet dogos {
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        # dogos-engage appends explicit TCP dport accepts here
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
