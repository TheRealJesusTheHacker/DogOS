#!/usr/sbin/nft -f
# DogOS base firewall — default-deny incoming (spec section 7).
# Engagement listeners are opened explicitly via `dogos-engage`.
flush ruleset

table inet dogos {
    # Engagement listener exceptions, managed by `dogos-engage`.
    # A set (not appended rules) keeps open/close idempotent and lets
    # `close` clear ports WITHOUT touching other tables (e.g. ghost).
    set engage_ports {
        type inet_service
    }

    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        tcp dport @engage_ports accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
